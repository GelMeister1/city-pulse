# Builds the Mac version (.dmg for Apple Silicon and Intel) on GitHub's Mac machines.
#   Run workflow (Actions tab): a test build, downloadable from the run's page.
#   A published release: the .dmg files are added to that release.
name: Mac build
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/isours.test.js
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: city-pulse-mac
          path: dist/*.dmg
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}   # passed as a variable, never pasted into the script
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG"; exit 1; }
          gh release upload "$TAG" dist/*.dmg --clobber
