<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Pulse</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  body.pan canvas{cursor:grab}
  #ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;transition:opacity .5s}
  #ui.hide,#panel.hide{opacity:0;pointer-events:none}
  button{background:#0d1020cc;color:#ddd;border:1px solid #445;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  button:hover,button:focus-visible{border-color:#aab;outline:none}
  button.on{border-color:#7cf;color:#fff}
  #hint{color:#889;font-size:12px;align-self:center}
  body.idle,body.idle canvas{cursor:none}
  #panel{position:fixed;top:52px;right:12px;width:220px;max-height:calc(100vh - 64px);overflow:hidden auto;box-sizing:border-box;
    background:#0b0e1cf2;border:1px solid #2c3352;border-radius:10px;padding:10px;color:#b9bdd0;font-size:12px;
    display:grid;gap:6px;transition:opacity .5s;-webkit-app-region:no-drag}
  #panel[hidden],#panel [hidden]{display:none}
  #panel label{display:grid;gap:3px}
  #panel label.row{display:flex;align-items:center;gap:6px}
  #panel select,#panel input[type=color]{font:inherit;background:#05060c;color:#ddd;border:1px solid #333a58;border-radius:4px;padding:3px}
  #panel input[type=range]{width:100%;accent-color:#6fc3ff}
  #panel input[type=checkbox]{accent-color:#6fc3ff}
  #panel summary{cursor:pointer;font-weight:600;color:#8fd3ff;background:#151b36;border-radius:6px;padding:6px 8px;
    list-style:none;display:flex;justify-content:space-between;letter-spacing:.02em}
  #panel summary:hover{background:#1b2347}
  #panel summary::after{content:'▸';color:#5d7bb0}
  #panel details[open] summary::after{content:'▾'}
  #panel .body{display:grid;gap:8px;padding:8px 4px 4px}
  #panel .presets{display:grid;gap:6px;padding-bottom:4px}
  #panel .row2{display:flex;gap:4px}
  #panel .row2 input{flex:1;min-width:0;font:inherit;background:#05060c;color:#ddd;border:1px solid #333a58;border-radius:4px;padding:3px 5px}
  #panel .presets button{padding:3px 8px;font-size:inherit}
  html.widget #panel .body{gap:5px;padding-top:5px}
  /* desktop widget (Electron, ?widget=1): transparent, draggable top bar, compact buttons */
  html.widget,html.widget body{background:transparent}
  html.widget #ui{top:0;left:0;right:0;padding:4px;gap:4px;background:#05060cdd;border-radius:8px;-webkit-app-region:drag}
  html.widget #ui button{-webkit-app-region:no-drag;padding:3px 6px;font-size:11px}
  html.widget #hint{display:none}
  html.widget #panel{top:32px;right:4px;width:196px;max-height:calc(100vh - 36px);padding:6px;font-size:11px}
  #close{display:none;margin-left:auto}
  html.widget #close,html.full #close{display:inline-block}
  /* audio source: output picker in the app, "Share audio" in a plain browser */
  #output{display:none;max-width:210px;background:#0d1020cc;color:#ddd;border:1px solid #445;border-radius:6px;padding:5px 6px;font:inherit;font-size:13px;-webkit-app-region:no-drag}
  html.app #output{display:block}
  html.app #share{display:none}
  html.widget #output{max-width:150px;padding:2px 4px;font-size:11px}
  /* settings window: just the panel, full size and easy to read */
  html.settings canvas,html.settings #ui{display:none}
  html.settings,html.settings body{overflow:auto;background:#0b0e1c}
  html.settings #panel{position:static;width:auto;max-height:none;border:0;border-radius:0;padding:14px 16px 24px;font-size:14px;gap:10px;background:none}
  html.settings #panel select,html.settings #panel input[type=color],html.settings #panel .row2 input{padding:6px;font-size:14px}
  html.settings #panel summary{padding:9px 10px;font-size:15px}
  html.settings #panel .body{gap:12px;padding:12px 4px 6px}
  /* live wallpaper: no controls at all */
  html.wall #ui,html.wall #panel{display:none !important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="output" title="Audio output City Pulse listens to (switches the Windows default)"></select>
  <button id="share">🔊 Share audio</button>
  <button id="gear" aria-expanded="false">⚙ Settings</button>
  <button id="fs">⛶ Full screen</button>
  <span id="hint">Demo beat playing · F full screen · M lights · C color · V view · W weather</span>
  <button id="close" title="Close">✕</button>
</div>
<div id="panel" hidden>
  <div class="presets">
    <label>Preset <select id="preset"></select></label>
    <div class="row2"><input id="presetName" placeholder="Name this look…" maxlength="30"><button id="presetSave">Save</button></div>
    <button id="presetDel" hidden>Delete this preset</button>
  </div>
  <details name="sect" open><summary>Skyline</summary><div class="body">
    <label>City <select id="city"></select></label>
    <label>View <select id="view">
      <option value="fit">Fit</option>
      <option value="pan">Pan</option>
      <option value="tour">Tour</option>
    </select></label>
    <label>Scroll speed <input type="range" id="scroll" min="1" max="100"></label>
    <label>Spacing <input type="range" id="gap" min="0" max="300"></label>
  </div></details>
  <details name="sect"><summary>Lights</summary><div class="body">
    <label>Style <select id="mode">
      <option value="floors">Floors</option>
      <option value="pulse">Pulse</option>
      <option value="flash">Beat flash</option>
    </select></label>
    <label class="row"><input type="checkbox" id="peak"> Peak marker</label>
    <label>Color <select id="effect">
      <option value="rainbow">Spectrum</option>
      <option value="wave">Wave</option>
      <option value="fade">Fade</option>
      <option value="static">Solid</option>
      <option value="breathing">Breathing</option>
      <option value="random">Random</option>
    </select></label>
    <label>Pick color <input type="color" id="color"></label>
    <label>Color speed <input type="range" id="speed" min="1" max="100"></label>
    <label>Reactivity <input type="range" id="react" min="0" max="100"></label>
    <label class="row"><input type="checkbox" id="loudFill"> Fill by loudness</label>
    <label class="row"><input type="checkbox" id="cityLine"> City line (one height for the whole city)</label>
    <label>City line height <input type="range" id="lineH" min="15" max="100"></label>
    <label>Brightness <input type="range" id="bright" min="5" max="100"></label>
    <label class="row"><input type="checkbox" id="meter"> Loudness meter</label>
  </div></details>
  <details name="sect"><summary>Scene</summary><div class="body">
    <label>Ground <select id="ground">
      <option value="street">Street</option>
      <option value="streetWater">Street &amp; water</option>
      <option value="parkWater">Park &amp; water</option>
      <option value="none">None</option>
    </select></label>
    <label>Traffic <input type="range" id="traffic" min="0" max="100"></label>
    <label class="row"><input type="checkbox" id="detail"> 3D detail</label>
    <label class="row"><input type="checkbox" id="back"> Back skyline</label>
    <label class="row"><input type="checkbox" id="captions"> City names</label>
    <label class="row"><input type="checkbox" id="drift"> Burn-in protection</label>
  </div></details>
  <details name="sect"><summary>Weather</summary><div class="body">
    <label>Weather <select id="weather">
      <option value="none">Clear</option>
      <option value="rain">Rain</option>
      <option value="snow">Snow</option>
      <option value="storm">Thunderstorm</option>
      <option value="fog">Fog</option>
      <option value="petals">Cherry blossoms</option>
      <option value="leaves">Autumn leaves</option>
    </select></label>
    <label>Amount <input type="range" id="wxAmt" min="5" max="100"></label>
  </div></details>
  <details name="sect"><summary>Ambient</summary><div class="body">
    <label class="row"><input type="checkbox" id="roofLights"> Roof lights</label>
    <label>Blink speed <input type="range" id="blinkSpeed" min="1" max="100"></label>
    <label class="row"><input type="checkbox" id="blinkSync"> Blink together</label>
    <label class="row"><input type="checkbox" id="blinkBeat"> Blink to the bass</label>
    <label>Light color <input type="color" id="blinkColor"></label>
    <label class="row"><input type="checkbox" id="flicker"> Window flicker</label>
    <label>Flicker amount <input type="range" id="flickAmt" min="1" max="100"></label>
    <label class="row"><input type="checkbox" id="search"> Searchlights</label>
    <label class="row"><input type="checkbox" id="flyers"> Flying cars</label>
    <label class="row"><input type="checkbox" id="stars"> Stars</label>
    <label class="row"><input type="checkbox" id="shooting"> Shooting stars</label>
    <label class="row"><input type="checkbox" id="skyBody"> Moon</label>
    <label class="row"><input type="checkbox" id="clouds"> Clouds</label>
    <label class="row"><input type="checkbox" id="planes"> Planes</label>
  </div></details>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
// Window kinds: widget, full (full screen), settings (the widget's settings window), wall (live wallpaper); none = plain browser.
const widget = qs.has('widget'), full = qs.has('full'), settingsMode = qs.has('settings'), wallMode = qs.has('wall');
const inApp = !!window.cityPulse;                                    // set by the app's preload; absent in a plain browser
for (const [on, cls] of [[widget, 'widget'], [full, 'full'], [settingsMode, 'settings'], [wallMode, 'wall'], [inApp, 'app']])
  if (on) document.documentElement.classList.add(cls);

// ---------- settings (remembered between launches) ----------
const DEF = { city: 'generic', view: 'fit', scroll: 30, gap: 40, pan: .5,
  mode: 'floors', peak: true, effect: 'rainbow', color: '#00e5ff', speed: 30, react: 60, loudFill: false, cityLine: false, lineH: 70, bright: 100, meter: true,
  ground: widget ? 'street' : 'streetWater', traffic: 35, detail: true, back: true, captions: true, drift: false,
  weather: 'none', wxAmt: 50,
  roofLights: true, blinkSpeed: 40, blinkSync: false, blinkBeat: false, blinkColor: '#ff3030', flicker: true, flickAmt: 20,
  search: false, flyers: true, stars: true, shooting: true, skyBody: true, clouds: true, planes: true };
let S;
const KEY = full ? 'cityPulse:full' : 'cityPulse';                  // widget and full screen keep their own settings; presets are shared
try { S = { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { S = { ...DEF }; }
if (!$('ground').querySelector(`[value="${S.ground}"]`)) S.ground = DEF.ground;   // settings saved by older versions
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// ---------- buildings ----------
// Window styles, in units: cw = column pitch, ch = floor pitch, ww/wh = window size as a share of the cell.
// One style per building, so every building keeps the same kind of window top to bottom.
const STY = {
  grid:   { cw: 2,   ch: 2,   ww: .5,  wh: .55 },          // square windows
  tall:   { cw: 1.6, ch: 2.6, ww: .4,  wh: .7 },           // tall narrow
  wide:   { cw: 3,   ch: 1.8, ww: .8,  wh: .45 },          // wide, short
  ribbon: { cw: 0,   ch: 1.6, ww: 1,   wh: .4 },           // one glass strip per floor
  pairs:  { cw: 1.5, ch: 2.2, ww: .6,  wh: .6, skip: 3 },  // windows in pairs
  slim:   { cw: 1.2, ch: 1.5, ww: .45, wh: .5 },           // dense, small (tall towers)
  cols:   { cw: 1.4, ch: 3.5, ww: .35, wh: .85 },          // vertical slits
};
const taper = (w0, w1, h, n) => Array.from({ length: n }, (_, i) => [w0 + (w1 - w0) * i / (n - 1), h / n]);

// Landmarks with hand-drawn silhouettes. Drawn in units, origin at ground centre, y up = negative.
// L.lit(y) = how lit the lights at height y are (0..1), L.win(a) = light colour, L.body / L.edge = structure colours.
function latticeTower({ hw, top, decks, arches, ant }) {
  const inArch = (x, y) => arches.some(([aw, ah, ay]) => Math.abs(x) < aw && y > ay && y < ay + ah * (1 - (x / aw) ** 2));
  return (g, L) => {
    g.fillStyle = L.body; g.beginPath();
    g.moveTo(hw(0), 0);
    for (let y = 0; y <= top; y += .5) g.lineTo(hw(y), -y);
    for (let y = top; y >= 0; y -= .5) g.lineTo(-hw(y), -y);
    g.closePath();
    for (const [aw, ah, ay] of arches) {                 // arch openings between the legs
      g.moveTo(aw, -ay); g.quadraticCurveTo(aw, -ay - ah * 1.3, 0, -ay - ah); g.quadraticCurveTo(-aw, -ay - ah * 1.3, -aw, -ay); g.closePath();
    }
    g.fill('evenodd');
    for (const [y, w, th] of decks) g.fillRect(-w, -y - th, 2 * w, th);
    g.fillRect(-ant[2], -ant[1], ant[2] * 2, ant[1] - ant[0]);
    if (L.edge) {                                        // criss-cross girders
      g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath();
      for (let y = 0; y < top - 2; y += 2.5) {
        const a = hw(y), b = hw(y + 2.5);
        for (const s of [-1, 1]) { g.moveTo(s * a, -y); g.lineTo(s * b * .72, -y - 2.5); g.moveTo(s * a * .72, -y); g.lineTo(s * b, -y - 2.5); }
      }
      g.stroke();
    }
    for (let y = 1; y < top; y += 1.6) {                 // lattice lights
      g.fillStyle = L.win(L.lit(y)); const w = hw(y);
      for (const k of [.9, .62, .35]) for (const s of [-1, 1]) {
        const x = s * w * k; if (!inArch(x, y)) g.fillRect(x - .22, -y - .22, .44, .44);
      }
    }
    for (const [y, w, th] of decks) { g.fillStyle = L.win(L.lit(y)); for (let x = -w + .5; x < w; x += 1) g.fillRect(x - .2, -y - th / 2 - .2, .4, .4); }
  };
}
const LM = {
  eiffel: { w: 26, h: 80, draw: latticeTower({
    hw: y => y <= 18 ? 5.5 + 7.5 * (1 - y / 18) ** 2 : y <= 37.5 ? 5.5 - 2.5 * (y - 18) / 19.5 : y <= 67 ? 3 - 2.1 * Math.sqrt((y - 37.5) / 29.5) : .9,
    top: 67, decks: [[18, 7.5, 1.8], [37.5, 4.2, 1.4], [65.5, 1.5, 2]], arches: [[8.5, 11.5, 0], [3.6, 7, 19.8]], ant: [67, 80, .25] }) },
  tokyotower: { w: 22, h: 76, draw: latticeTower({
    hw: y => y <= 34 ? 2.6 + 8.4 * (1 - y / 34) ** 1.6 : y <= 58 ? 2.6 - 1.6 * (y - 34) / 24 : .9,
    top: 58, decks: [[30, 5.5, 4], [56, 2.2, 2]], arches: [[7, 9, 0]], ant: [58, 76, .3] }) },
  needle: { w: 15, h: 72, draw(g, L) {
    const hw = y => y < 30 ? .9 + 4.6 * (1 - y / 30) ** 2 : .9 + 1.6 * ((y - 30) / 16) ** 2;
    g.strokeStyle = g.fillStyle = L.body; g.lineWidth = .7; g.beginPath();
    for (const s of [-1, 1]) { g.moveTo(s * hw(0), 0); for (let y = 1; y <= 46; y++) g.lineTo(s * hw(y), -y); }   // hourglass legs
    g.stroke();
    g.fillRect(-.6, -46, 1.2, 46);                       // core
    g.fillRect(-2.4, -14.6, 4.8, .8);                    // lower platform ring
    g.beginPath();                                       // saucer + roof
    [[-2.5, -46], [-7.2, -49.6], [-6.4, -50.8], [-5, -51.2], [-1.4, -54], [1.4, -54], [5, -51.2], [6.4, -50.8], [7.2, -49.6], [2.5, -46]]
      .forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
    g.fill();
    g.beginPath(); g.moveTo(-.6, -54); g.lineTo(0, -72); g.lineTo(.6, -54); g.fill();   // spire
    if (L.edge) { g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath(); g.moveTo(-7.2, -49.6); g.lineTo(7.2, -49.6); g.moveTo(-5, -51.2); g.lineTo(5, -51.2); g.stroke(); }
    for (let y = 1; y < 45; y += 2) { g.fillStyle = L.win(L.lit(y)); g.fillRect(-.3, -y - .6, .6, .6); }   // elevator lights climbing the core
    g.fillStyle = L.win(L.lit(47.5));                    // lights under the saucer
    for (let i = 0; i <= 6; i++) { const f = i / 6; for (const s of [-1, 1]) g.fillRect(s * (2.5 + 4.5 * f) - .2, -46 - 3.5 * f - .2, .4, .4); }
    g.fillStyle = L.win(L.lit(50));                      // restaurant windows
    for (let x = -6.5; x < 6.4; x += .9) g.fillRect(x, -50.6, .55, .7);
  } },
  bigben: { w: 9, h: 63, draw(g, L) {
    g.fillStyle = L.body;
    g.fillRect(-3, -36, 6, 36);                          // shaft
    g.fillRect(-3.7, -44.5, 7.4, 8.5);                   // clock stage
    g.fillRect(-3.9, -45.3, 7.8, .8);                    // cornice
    g.fillRect(-3.2, -50, 6.4, 4.7);                     // belfry
    g.beginPath(); g.moveTo(-3.6, -50); g.lineTo(0, -60.5); g.lineTo(3.6, -50); g.fill();   // spire
    for (const x of [-3.6, -1.6, 1.6, 3.6]) { g.beginPath(); g.moveTo(x - .45, -50); g.lineTo(x, -53.5); g.lineTo(x + .45, -50); g.fill(); }   // pinnacles
    g.fillRect(-.12, -63, .24, 2.6);                     // finial
    if (L.edge) {                                        // stone pilasters and ledges
      g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath();
      for (const x of [-3, -1.5, 1.5, 3]) { g.moveTo(x, 0); g.lineTo(x, -36); }
      for (let y = 6; y < 36; y += 6) { g.moveTo(-3, -y); g.lineTo(3, -y); }
      g.rect(-3.7, -44.5, 7.4, 8.5); g.stroke();
    }
    for (let y = 3; y < 34; y += 3.4) { g.fillStyle = L.win(L.lit(y)); for (const x of [-2.25, -.25, 1.75]) g.fillRect(x, -y - 2, .5, 2); }   // shaft slits
    g.fillStyle = L.win(Math.max(L.lit(40), .2));        // clock face, always softly lit
    g.beginPath(); g.arc(0, -40.2, 2.6, 0, 7); g.fill();
    g.strokeStyle = L.body; g.lineWidth = .25; g.beginPath();
    g.moveTo(0, -40.2); g.lineTo(0, -42.2); g.moveTo(0, -40.2); g.lineTo(1.3, -40.2); g.stroke();
    g.fillStyle = L.win(L.lit(47.5));                    // belfry arches
    for (const x of [-2.1, -.7, .7, 2.1]) { g.fillRect(x - .35, -48.6, .7, 2.4); g.beginPath(); g.arc(x, -48.6, .35, Math.PI, 0); g.fill(); }
  } },
  chrysler: { w: 13, h: 100, draw(g, L) {
    g.fillStyle = L.body;
    g.fillRect(-6.5, -24, 13, 24);                       // base block
    g.fillRect(-5, -58, 10, 34);                         // main shaft
    g.fillRect(-4, -64, 8, 6);                           // setback below the crown
    for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 5, -58); g.lineTo(s * 6.2, -57); g.lineTo(s * 5, -56); g.fill(); }   // eagle gargoyles
    const arches = [];                                   // the terraced sunburst crown: stacked arches, each narrower
    for (let i = 0; i < 6; i++) arches.push({ w: 4 - i * .6, y: -64 - i * 2.4 });
    for (const a of arches) { g.beginPath(); g.ellipse(0, a.y, a.w, 3, 0, Math.PI, 2 * Math.PI); g.fill(); }
    g.beginPath(); g.moveTo(-.7, -76); g.lineTo(0, -100); g.lineTo(.7, -76); g.fill();   // needle spire
    if (L.edge) {
      g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath();
      for (const x of [-5, -2.5, 2.5, 5]) { g.moveTo(x, -24); g.lineTo(x, -58); }
      g.moveTo(-6.5, -24); g.lineTo(6.5, -24); g.stroke();
    }
    for (let y = 1.5; y < 57; y += 2.2) {                // windows
      g.fillStyle = L.win(L.lit(y)); const hw = y < 24 ? 5.6 : 4.2;
      for (let x = -hw; x <= hw - .5; x += 1.4) g.fillRect(x, -y - 1, .5, 1);
    }
    for (const a of arches) {                            // the famous triangle windows in each arch
      g.fillStyle = L.win(Math.max(L.lit(-a.y), .25));
      for (let k = -2; k <= 2; k++) {
        const ang = Math.PI * 1.5 + k * .45, x = Math.cos(ang) * a.w * .72, y = a.y + Math.sin(ang) * 2.1;
        g.beginPath(); g.moveTo(x - .3, y + .45); g.lineTo(x, y - .5); g.lineTo(x + .3, y + .45); g.fill();
      }
    }
  } },
  empire: { w: 15, h: 108, draw(g, L) {
    g.fillStyle = L.body;
    g.fillRect(-7.5, -10, 15, 10);                       // five-storey base
    g.fillRect(-5.5, -64, 11, 54);                       // main shaft
    g.fillRect(-1.6, -64, 3.2, 54.5);                    // centre bay standing slightly proud
    g.fillRect(-4.5, -68, 9, 4); g.fillRect(-3.5, -72, 7, 4); g.fillRect(-2.6, -76, 5.2, 4);   // the setbacks
    g.fillRect(-1.8, -84, 3.6, 8);                       // crown tower
    g.fillRect(-.9, -92, 1.8, 8); g.fillRect(-.5, -98, 1, 6);   // mooring mast
    g.beginPath(); g.moveTo(-.4, -98); g.lineTo(0, -108); g.lineTo(.4, -98); g.fill();   // antenna
    for (let y = 11; y < 63; y += 2) {                   // tall paired windows between piers
      g.fillStyle = L.win(L.lit(y));
      for (let x = -5; x < 4.8; x += 1.25) if (Math.abs(x + .3) > 1.2) g.fillRect(x, -y - 1.3, .45, 1.3);
    }
    g.fillStyle = L.win(Math.max(L.lit(80), .3));        // the famous lit crown
    for (const [y, w] of [[-79, 3], [-82, 3], [-88, 1.4]]) g.fillRect(-w / 2, y, w, 1);
  } },
  hancock: { w: 15, h: 104, draw(g, L) {
    const hw = y => 7.5 - 2.5 * y / 76;                  // tapers from bottom to top

// Noir City: one rooftop spotlight with the shadow of a real-looking bat caught in its soft, round pool of light.
// An original, naturalistic silhouette (raised wings, finger-tip points along the membrane), not any brand's emblem.
// Right half (x 0..1 = body to wingtip, y down), mirrored for the left. Starts at the top of the head.
const BAT = [
  ['L', .04, -.33], ['L', .07, -.44], ['L', .1, -.3], ['L', .12, -.18],   // ear and head
  ['L', .16, -.1],                                                          // shoulder
  ['Q', .3, -.25, .48, -.5], ['L', .52, -.52],                              // leading edge up to the raised wrist
  ['Q', .75, -.4, .98, -.28],                                               // long outer finger to the wingtip
  ['Q', .84, -.18, .86, .02],                                               // membrane sagging between finger tips
  ['Q', .7, -.06, .62, .16],
  ['Q', .42, -.02, .2, .2],
  ['L', .14, .32], ['L', .05, .3], ['L', -.03, .34],                        // foot and tail membrane

function getBatSprite() {                                  // drawn once, opaque, so the two halves never show a seam

}
function drawBatSignal(g, tip, t) {

// Cyberpunk skybridges, drawn once both towers are in place.
function drawBridges(g, wrapK) {
  const u = unit;
  for (const { a, c, y } of bridges) for (const k of wrapK) {
    const x0 = a.cx + a.wpx / 2 - off + k * worldW, x1 = c.cx - c.wpx / 2 - off + k * worldW;

let plane = null, nextPlane = 6000, shoot = null, nextShoot = 4000, bassFlash = 0, cloudKey = '';
// Synthwave: a big striped sun sinking behind neon-edged mountains.
function drawSynthSun(g, sky) {
  const r = Math.min(W, H) * .19, cx = W / 2, cy = GY * .42;   // high enough to clear the towers
  const sun = g.createLinearGradient(0, cy - r, 0, cy + r);
  sun.addColorStop(0, '#ffe66d'); sun.addColorStop(.55, '#ff8a5c'); sun.addColorStop(1, '#ff3d8b');
  g.fillStyle = 'rgba(255,90,150,.18)'; g.beginPath(); g.arc(cx, cy, r * 1.25, 0, 7); g.fill();   // haze
  g.fillStyle = sun; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();

  g.strokeStyle = 'rgba(255,61,240,.6)'; g.lineWidth = 1.5; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();

      w: W * (over ? .14 + Math.random() * .2 : .07 + Math.random() * .12), v: 3 + Math.random() * 7 }));

// Cyberpunk flying cars: little light pairs gliding between the towers, some behind, some in front.
let flyers = [];
function drawFlyers(g, dt, layer, scrollV) {
  if (!cyber || !S.flyers) return;
  if (!flyers.length) flyers = Array.from({ length: 10 }, (_, i) => ({ layer: i % 2, dir: Math.random() < .5 ? 1 : -1, x: Math.random() * W,
    y: GY * (.18 + .55 * Math.random()), v: unit * (8 + Math.random() * 10), hue: NEON[i % 3] }));
  const u = unit;
  for (const f of flyers) {

    g.fillStyle = '#0d0d12';                                                   // block joints
    const bw = 4 * u;
    for (let x = -(travel % bw); x < W; x += bw) g.fillRect(x, wy + 1, 1, wh);
    g.fillRect(0, wy + wh * .55, W, 1);
  }
}
// Soft round glow, drawn once per colour and reused (gradients rebuilt every frame are costly).
const sprites = {};
function sprite(rgb) {
  if (sprites[rgb]) return sprites[rgb];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), rg = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, `rgba(${rgb},1)`); rg.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = rg; x.fillRect(0, 0, 128, 128);
  return sprites[rgb] = c;
}
// Water: a thin band at the very bottom that mirrors the lit city just above the ground, with a gentle ripple.
// The strip to mirror is copied out once per frame; slicing it straight off the screen canvas costs a full copy per slice.
const rc = document.createElement('canvas'), rcx = rc.getContext('2d');
function drawWater(g, t) {
  const src = g.canvas, sc = src.width / W, wh = H - WY, band = Math.min(GY, wh * 2);
  rc.width = src.width; rc.height = Math.max(1, Math.ceil(band * sc));
  rcx.drawImage(src, 0, (GY - band) * sc, src.width, band * sc, 0, 0, src.width, band * sc);
  for (let y = 0; y < wh; y += 2) {
    const sy = (band - y * 2 - 2) * sc;                // squashed reflection: 2 source rows per water row
    if (sy < 0) break;
    const dx = Math.sin(y * .6 + t / 380) * (1 + y * .15);
    g.drawImage(rc, 0, sy, rc.width, 2 * sc, dx, WY + y, W, 2);
  }
  const tint = g.createLinearGradient(0, WY, 0, H);
  tint.addColorStop(0, 'rgba(4,6,18,.45)'); tint.addColorStop(1, 'rgba(4,6,18,.85)');
  g.fillStyle = tint; g.fillRect(0, WY, W, wh);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, WY, W, 1);   // waterline
}

// Weather particles, in screen space.
let wx = [], wxKey = '', fogs = [];
function drawWeather(g, t, dt) {
  const type = S.weather === 'storm' ? 'rain' : S.weather, amt = S.wxAmt / 100;
  if (type === 'none') return;
  const key = S.weather + S.wxAmt + W + H;
  if (key !== wxKey) {
    wxKey = key;
    const per = { rain: 1100, snow: 3200, petals: 13000, leaves: 13000 }[type];   // pixels of screen per particle
    const n = per ? Math.round(W * H / per * amt * (S.weather === 'storm' ? 1.6 : 1)) : 0;
    wx = Array.from({ length: n }, () => ({ x: Math.random() * W * 1.2, y: Math.random() * H, s: Math.random(), rot: Math.random() * 6, spin: (Math.random() - .5) * 3 }));
  }
  if (type === 'rain') {
    g.strokeStyle = cyber ? 'rgba(200,170,255,.3)' : 'rgba(170,190,255,.28)'; g.lineWidth = 1; g.beginPath();
    for (const p of wx) {
      const sp = H * (1.1 + p.s * .6), len = 10 + p.s * 14;
      p.y += sp * dt; p.x -= sp * .15 * dt;
      if (p.y > H) { p.y = -20; p.x = Math.random() * W * 1.2; }
      g.moveTo(p.x, p.y); g.lineTo(p.x + len * .15, p.y - len);
    }
    g.stroke();
  } else if (type === 'snow') {
    g.fillStyle = 'rgba(235,240,255,.8)';
    for (const p of wx) {
      p.y += (18 + p.s * 30) * dt; p.x += Math.sin(t / 1300 + p.rot) * 12 * dt;
      if (p.y > H) { p.y = -5; p.x = Math.random() * W; }
      const r = 1 + p.s * 1.8; g.fillRect(p.x, p.y, r, r);
    }
  } else if (type === 'petals' || type === 'leaves') {
    const cols = type === 'petals' ? ['#ffb7d5', '#ff9ec4', '#ffd1e3'] : ['#d2691e', '#b5651d', '#e0a030', '#a0371c'];
    g.globalAlpha = .85;
    for (const p of wx) {
      p.y += (22 + p.s * 25) * dt; p.x += (Math.sin(t / 900 + p.rot) * 25 + 10) * dt; p.rot += p.spin * dt;
      if (p.y > H || p.x > W + 20) { p.y = -10; p.x = Math.random() * W - 40; }
      const sz = 2.5 + p.s * 2.5;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = cols[Math.floor(p.s * cols.length)];
      if (type === 'petals') { g.beginPath(); g.ellipse(0, 0, sz, sz * .55, 0, 0, 7); g.fill(); } else g.fillRect(-sz, -sz * .5, sz * 2, sz);
      g.restore();
    }
    g.globalAlpha = 1;
  } else if (type === 'fog') {                           // mist drifting between the buildings; the slider adds more banks and a thicker haze
    const nWant = 6 + Math.round(18 * amt), rgb = cyber ? '200,90,210' : synth ? '255,110,200' : '150,150,190';
    if (fogs.length !== nWant) fogs = Array.from({ length: nWant }, () => ({ x: Math.random() * W, y: GY * (.35 + .62 * Math.random()), w: W * (.35 + .4 * Math.random()), v: 5 + Math.random() * 10 }));
    const haze = g.createLinearGradient(0, GY * .3, 0, GY);
    haze.addColorStop(0, `rgba(${rgb},0)`); haze.addColorStop(1, `rgba(${rgb},${.32 * amt})`);
    g.fillStyle = haze; g.fillRect(0, GY * .3, W, H - GY * .3);
    const puff = sprite(rgb);
    g.globalAlpha = .12 + .22 * amt;
    for (const f of fogs) {
      f.x += f.v * dt; if (f.x - f.w / 2 > W) f.x = -f.w / 2;
      g.drawImage(puff, f.x - f.w / 2, f.y - f.w * .11, f.w, f.w * .22);   // flattened glow = a bank of mist
    }
    g.globalAlpha = 1;
  }
}

let phase = 0, last = 0, meterLvl = 0, off = 0, spectrum = new Array(NB).fill(0);
function frame(t) {
  const dt = Math.min(.1, (t - last) / 1000); last = t;
  if (settingsMode) return;                              // the settings window draws no city
  if (!buildings.length) { if (innerWidth && innerHeight) layout(); return; }   // window had no size yet
  phase += dt * S.speed / 25;
  if (analyser) analyser.getByteFrequencyData(bins);
  calm = 1 - S.react / 100;
  updateBands(t, dt);

  for (const b of buildings) {                           // each building follows its band
    const band = bands[b.band];
    b.level = band.level; b.flash = band.flash;
    const litF = litFloors(b);                           // peak: hold briefly, then drop one floor at a time, same speed everywhere
    if (litF >= b.pk) { b.pk = litF; b.hold = t; } else if (t - b.hold > 300) b.pk = Math.max(litF, b.pk - dt * 8);
    const lv = S.mode === 'flash' ? b.flash : b.level;
    if (lv > .85 && b.prev < .4) b.rhue = Math.random() * 360;          // "random" effect: new colour on a hit
    b.prev = lv;
  }
  bassFlash = Math.max(bands[0].flash, bands[1].flash);  // roof lights "blink to the bass"
  for (let k = 0; k < NB; k++) spectrum[k] = bands[k].level;   // hologram equalizers

  // Loudness meter: the real signal peak, scaled by the Windows volume, so at 50% volume it tops out halfway.
  let peak = 0;
  if (src) { analyser.getFloatTimeDomainData(tbuf); for (let i = 0; i < tbuf.length; i++) peak = Math.max(peak, Math.abs(tbuf[i])); }
  else peak = .5 + .4 * bands[0].level;                  // demo beat
  meterLvl = Math.max(Math.min(1, peak) * (sysMuted ? 0 : sysVol), meterLvl * Math.pow(.15, dt));

  const prevOff = off;
  if (S.view === 'tour') off = (off + dt * S.scroll * unit * .08) % worldW;
  else off = S.view === 'pan' ? S.pan * Math.max(0, worldW - W) : 0;
  const moved = S.view === 'tour' ? dt * S.scroll * unit * .08 : off - prevOff;
  travel += moved;                                       // keeps going across the tour's wrap-around, so street lamps never jump
  const scrollV = dt ? moved / dt : 0;

  const g = ctx, wrapK = S.view === 'tour' ? [0, 1] : [0];
  g.clearRect(0, 0, W, H);
  if (!widget) drawSky(g, t, dt);                      // the widget never draws a sky: the desktop shows behind
  if (S.back && backW) {                                // back skyline, sliding at half speed for depth
    const bo = S.view === 'tour' ? (off / 2) % backW : off / 2;
    g.drawImage(bc, -bo, 0);
    if (S.view === 'tour') g.drawImage(bc, backW - bo, 0);
  }
  drawFlyers(g, dt, 0, scrollV);

  for (const b of buildings) for (const k of wrapK) {
    const cx = b.cx - off + k * worldW;
    if (cx + b.half < 0 || cx - b.half > W) continue;
    drawBuilding(g, b, cx, t);
  }
  if (cyber) drawBridges(g, wrapK);
  drawFlyers(g, dt, 1, scrollV);
  drawGround(g, dt, scrollV);
  if (WY < H) drawWater(g, t);
  drawWeather(g, t, dt);

  // City name fades in near the top as each skyline scrolls into the middle of the tour.
  if (S.view === 'tour' && S.captions) {
    const mid = (off + W / 2) % worldW, size = Math.max(14, Math.min(W, H) * .032);
    g.font = `300 ${size}px system-ui, sans-serif`; g.textAlign = 'center'; g.letterSpacing = `${size * .35}px`;
    // One name at a time: the nearest city's, fully bright when its centre is at screen centre, fading to
    // nothing exactly halfway to the next city, where the next name starts fading in.
    const wrapD = x => x - Math.round(x / worldW) * worldW, n = tourMarks.length;
    let i = 0;
    tourMarks.forEach((m, k) => { if (Math.abs(wrapD(m.mid - mid)) < Math.abs(wrapD(tourMarks[i].mid - mid))) i = k; });
    const d = wrapD(tourMarks[i].mid - mid), nb = tourMarks[(i + (d < 0 ? 1 : n - 1)) % n];
    const half = Math.abs(wrapD(nb.mid - tourMarks[i].mid)) / 2 || W;
    let a = Math.max(0, 1 - Math.abs(d) / half); a = a * a * (3 - 2 * a);   // smoothstep: gentle in, gentle out
    if (a > .01) { g.fillStyle = `rgba(255,255,255,${a * .6})`; g.fillText(tourMarks[i].name.toUpperCase(), W / 2, H * .13); }
    g.letterSpacing = '0px';
  }
  // TV burn-in protection: the whole picture creeps at most 3 px, one pixel every minute or so (a full cycle takes ~20 min).
  const tf = S.drift && !widget ? `translate(${Math.round(Math.sin(t / 190000) * 3)}px,${Math.round(Math.sin(t / 140000) * 2)}px)` : '';
  if (tf !== cv.style.transform) cv.style.transform = tf;   // only touch the style when it actually moves

  // The City line itself, with a label, while the controls are showing.
  if (lineShown()) {
    const y = Math.round(GY - cityLineY()) + .5;
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1; g.setLineDash([6, 5]);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.setLineDash([]);
    g.font = '12px system-ui, sans-serif'; g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.75)';
    g.fillText('City line — drag to set', 10, y - 6);
  }

  // Loudness meter: segmented bar on the right edge, topping out at the Windows volume (thin line marks it).
  if (S.meter) {
    const segs = 20, mh = Math.min(GY * .5, 160), sh = mh / segs, x = W - 12, on = Math.round(meterLvl * segs);
    for (let i = 0; i < segs; i++) {
      g.fillStyle = i >= on ? '#ffffff14' : i >= segs * .85 ? '#ff4040' : i >= segs * .6 ? '#ffd040' : '#40ff80';
      g.fillRect(x, GY - 10 - (i + 1) * sh, 6, sh - 2);
    }
    if (inApp) { g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(x - 2, GY - 10 - (sysMuted ? 0 : sysVol) * mh - 1, 10, 1.5); }
  }
}

layout();
// The one animation loop. frame() never schedules itself, so an extra call can't start a second loop.
(function loop(t) { frame(t); requestAnimationFrame(loop); })(performance.now());
</script>
</body>
</html>
