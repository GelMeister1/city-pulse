<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Pulse</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  body.pan canvas{cursor:grab}
  #ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;transition:opacity .5s}
  #ui.hide,#panel.hide{opacity:0;pointer-events:none}
  button{background:#0d1020cc;color:#ddd;border:1px solid #445;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  button:hover,button:focus-visible{border-color:#aab;outline:none}
  button.on{border-color:#7cf;color:#fff}
  #hint{color:#889;font-size:12px;align-self:center}
  body.idle,body.idle canvas{cursor:none}
  #panel{position:fixed;top:52px;right:12px;width:220px;max-height:calc(100vh - 64px);overflow:hidden auto;box-sizing:border-box;
    background:#0b0e1cf2;border:1px solid #2c3352;border-radius:10px;padding:10px;color:#b9bdd0;font-size:12px;
    display:grid;gap:6px;transition:opacity .5s;-webkit-app-region:no-drag}
  #panel[hidden],#panel [hidden]{display:none}
  #panel label{display:grid;gap:3px}
  #panel label.row{display:flex;align-items:center;gap:6px}
  #panel select,#panel input[type=color]{font:inherit;background:#05060c;color:#ddd;border:1px solid #333a58;border-radius:4px;padding:3px}
  #panel input[type=range]{width:100%;accent-color:#6fc3ff}
  #panel input[type=checkbox]{accent-color:#6fc3ff}
  #panel summary{cursor:pointer;font-weight:600;color:#8fd3ff;background:#151b36;border-radius:6px;padding:6px 8px;
    list-style:none;display:flex;justify-content:space-between;letter-spacing:.02em}
  #panel summary:hover{background:#1b2347}
  #panel summary::after{content:'▸';color:#5d7bb0}
  #panel details[open] summary::after{content:'▾'}
  #panel .body{display:grid;gap:8px;padding:8px 4px 4px}
  #panel .presets{display:grid;gap:6px;padding-bottom:4px}
  #panel .row2{display:flex;gap:4px}
  #panel .row2 input{flex:1;min-width:0;font:inherit;background:#05060c;color:#ddd;border:1px solid #333a58;border-radius:4px;padding:3px 5px}
  #panel .presets button{padding:3px 8px;font-size:inherit}
  html.widget #panel .body{gap:5px;padding-top:5px}
  html.widget,html.widget body{background:transparent}
  html.widget #ui{top:0;left:0;right:0;padding:4px;gap:4px;background:#05060cdd;border-radius:8px;-webkit-app-region:drag}
  html.widget #ui button{-webkit-app-region:no-drag;padding:3px 6px;font-size:11px}
  html.widget #hint{display:none}
  html.widget #panel{top:32px;right:4px;width:196px;max-height:calc(100vh - 36px);padding:6px;font-size:11px}
  #close{display:none;margin-left:auto}
  html.widget #close,html.full #close{display:inline-block}
  /* audio source: output picker in the app, "Share audio" in a plain browser */
  #output{display:none;max-width:210px;background:#0d1020cc;color:#ddd;border:1px solid #445;border-radius:6px;padding:5px 6px;font:inherit;font-size:13px;-webkit-app-region:no-drag}
  html.app #output{display:block}
  html.app #share{display:none}
  html.widget #output{max-width:150px;padding:2px 4px;font-size:11px}
  html.settings canvas,html.settings #ui{display:none}
  html.settings,html.settings body{overflow:auto;background:#0b0e1c}
  html.settings #panel{position:static;width:auto;max-height:none;border:0;border-radius:0;padding:14px 16px 24px;font-size:14px;gap:10px;background:none}
  html.settings #panel select,html.settings #panel input[type=color],html.settings #panel .row2 input{padding:6px;font-size:14px}
  html.settings #panel summary{padding:9px 10px;font-size:15px}
  html.settings #panel .body{gap:12px;padding:12px 4px 6px}
  html.wall #ui,html.wall #panel{display:none !important}
  #cc,#ccOpen{display:none}
  html.app #ccOpen:not([hidden]){display:inline-block}
  html.control canvas,html.control #ui,html.control #panel{display:none !important}
  html.control,html.control body{overflow:auto;background:#0b0e1c}
  html.control #cc{display:grid;gap:16px;padding:14px 16px 24px;color:#b9bdd0;font-size:14px}
  #cc h1{margin:0;font-size:18px;font-weight:600;color:#e6e9f5}
  #cc h2{margin:0 0 6px;font-size:14px;font-weight:600;color:#8fd3ff;letter-spacing:.02em}
  #cc select{font:inherit;background:#05060c;color:#ddd;border:1px solid #333a58;border-radius:4px;padding:6px;width:100%;min-width:0}
  #cc .seg{display:flex;flex-wrap:wrap;gap:6px}
  #cc button{font-size:13px}
  #cc button.on{border-color:#7cf;color:#fff;background:#16305a}
  #cc .big{padding:10px;font-size:15px;font-weight:600}
  #cc .scr{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
  #cc .scr small{display:block;color:#778}
  #cc .note{margin:6px 0 0;font-size:12px;color:#778}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="output" title="Listen to: what City Pulse reacts to"></select>
  <button id="share">🔊 Share audio</button>
  <button id="gear" aria-expanded="false">⚙ Settings</button>
  <button id="fs">⛶ Full screen</button>
  <button id="ccOpen" title="Control center">☰</button>
  <span id="hint">Demo beat playing · F full screen · M lights · C color · V view · W weather</span>
  <button id="close" title="Close">✕</button>
</div>
<div id="cc">
  <h1>City Pulse</h1>
  <section><h2>Listen to</h2><select id="ccSource"></select></section>
  <section><h2>Full screen</h2><div class="seg" id="ccFull"></div></section>
  <section><h2>Live wallpaper</h2><div class="seg" id="ccWall"></div></section>
  <button id="ccTour" class="big">Tour on every screen</button>
  <section><h2>Screens</h2><div class="scr" id="ccScreens"></div>
    <p class="note">Each screen's city is used when full screen or the wallpaper shows its own city on each screen.</p></section>
  <section><h2>Widget</h2><div class="seg"><button id="ccWidget">Show widget</button><button id="ccWidgetSet">Widget settings…</button></div></section>
</div>
<div id="panel" hidden>
  <div class="presets">
    <label>Preset <select id="preset"></select></label>
    <div class="row2"><input id="presetName" placeholder="Name this look…" maxlength="30"><button id="presetSave">Save</button></div>
    <button id="presetDel" hidden>Delete this preset</button>
  </div>
  <details name="sect" open><summary>Skyline</summary><div class="body">
    <label>City <select id="city"></select></label>
    <label>View <select id="view">
      <option value="fit">Fit</option>
      <option value="pan">Pan</option>
      <option value="tour">Tour</option>
    </select></label>
    <label>Scroll speed <input type="range" id="scroll" min="1" max="100"></label>
    <label>Scroll direction <select id="scrollDir">
      <option value="rtl">Right to left</option>
      <option value="ltr">Left to right</option>
    </select></label>
    <label>Spacing <input type="range" id="gap" min="0" max="300"></label>
  </div></details>
  <details name="sect"><summary>Lights</summary><div class="body">
    <label>Style <select id="mode">
      <option value="floors">Floors</option>
      <option value="pulse">Pulse</option>
      <option value="flash">Beat flash</option>
    </select></label>
    <label class="row"><input type="checkbox" id="peak"> Peak marker</label>
    <label>Color <select id="effect">
      <option value="rainbow">Spectrum</option>
      <option value="wave">Wave</option>
      <option value="fade">Fade</option>
      <option value="static">Solid</option>
      <option value="breathing">Breathing</option>
      <option value="random">Random</option>
      <option value="drift">Smooth random</option>
    </select></label>
    <label>Pick color <input type="color" id="color"></label>
    <label>Color speed <input type="range" id="speed" min="1" max="100"></label>
    <label>Reactivity <input type="range" id="react" min="0" max="100"></label>
    <label class="row"><input type="checkbox" id="loudFill"> Fill by loudness</label>
    <label class="row"><input type="checkbox" id="cityLine"> City line (one height for the whole city)</label>
    <label>City line height <input type="range" id="lineH" min="15" max="100"></label>
    <label>Brightness <input type="range" id="bright" min="5" max="100"></label>
    <label class="row"><input type="checkbox" id="meter"> Loudness meter</label>
  </div></details>
  <details name="sect"><summary>Scene</summary><div class="body">
    <label>Ground <select id="ground">
      <option value="street">Street</option>
      <option value="streetWater">Street &amp; water</option>
      <option value="parkWater">Park &amp; water</option>
      <option value="none">None</option>
    </select></label>
    <label>Traffic <input type="range" id="traffic" min="0" max="100"></label>
    <label class="row"><input type="checkbox" id="detail"> 3D detail</label>
    <label class="row"><input type="checkbox" id="back"> Back skyline</label>
    <label class="row"><input type="checkbox" id="captions"> City names</label>
    <label class="row"><input type="checkbox" id="drift"> Burn-in protection</label>
  </div></details>
  <details name="sect"><summary>Weather</summary><div class="body">
    <label>Weather <select id="weather">
      <option value="none">Clear</option>
      <option value="rain">Rain</option>
      <option value="snow">Snow</option>
      <option value="storm">Thunderstorm</option>
      <option value="fog">Fog</option>
      <option value="petals">Cherry blossoms</option>
      <option value="leaves">Autumn leaves</option>
    </select></label>
    <label>Amount <input type="range" id="wxAmt" min="5" max="100"></label>
  </div></details>
  <details name="sect"><summary>Ambient</summary><div class="body">
    <label class="row"><input type="checkbox" id="roofLights"> Roof lights</label>
    <label>Blink speed <input type="range" id="blinkSpeed" min="1" max="100"></label>
    <label class="row"><input type="checkbox" id="blinkSync"> Blink together</label>
    <label class="row"><input type="checkbox" id="blinkBeat"> Blink to the bass</label>
    <label>Light color <input type="color" id="blinkColor"></label>
    <label class="row"><input type="checkbox" id="flicker"> Window flicker</label>
    <label>Flicker amount <input type="range" id="flickAmt" min="1" max="100"></label>
    <label class="row"><input type="checkbox" id="search"> Searchlights</label>
    <label class="row"><input type="checkbox" id="flyers"> Flying cars</label>
    <label class="row"><input type="checkbox" id="stars"> Stars</label>
    <label class="row"><input type="checkbox" id="shooting"> Shooting stars</label>
    <label class="row"><input type="checkbox" id="skyBody"> Moon</label>
    <label class="row"><input type="checkbox" id="clouds"> Clouds</label>
    <label class="row"><input type="checkbox" id="planes"> Planes</label>
  </div></details>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const mod = (x, m) => ((x % m) + m) % m;                    // remainder that stays positive (the tour can scroll backwards)
const qs = new URLSearchParams(location.search);
// Window kinds: widget, full (full screen), settings (a settings window), wall (live wallpaper), control (the app's control
// center); none = plain browser. Settings and control windows draw no city and don't listen.
const widget = qs.has('widget'), full = qs.has('full'), settingsMode = qs.has('settings'), wallMode = qs.has('wall'), controlMode = qs.has('control');
const noCity = settingsMode || controlMode;
const inApp = !!window.cityPulse;                                    // set by the app's preload; absent in a plain browser
for (const [on, cls] of [[widget, 'widget'], [full, 'full'], [settingsMode, 'settings'], [wallMode, 'wall'], [controlMode, 'control'], [inApp, 'app']])
  if (on) document.documentElement.classList.add(cls);
// Whose settings this window uses. The settings window edits whichever one it was opened for (?settings=1&for=…).
const TARGET = settingsMode ? (['widget', 'full', 'wall'].includes(qs.get('for')) ? qs.get('for') : 'widget')
  : wallMode ? 'wall' : full ? 'full' : 'widget';
// Several screens: screen=<i> (0 = left-most) and screens=<w>x<h>,… (all of them, left to right, CSS px).
// mode=per gives each screen its own city (its own settings key); mode=span runs one tour across all of them.
const screenI = Math.max(0, parseInt(qs.get('screen'), 10) || 0);
const screens = (qs.get('screens') || '').split(',').map(s => s.split('x').map(Number)).filter(a => a.length === 2 && a.every(n => n > 0));
const spanMode = !settingsMode && qs.get('mode') === 'span';
const perScreen = qs.has('screen') && (qs.get('mode') === 'per' || (settingsMode && qs.get('mode') !== 'span'));

// ---------- settings (remembered between launches) ----------
const DEF = { city: 'generic', view: 'fit', scroll: 30, scrollDir: 'rtl', gap: 40, pan: .5,
  mode: 'floors', peak: true, effect: 'rainbow', color: '#00e5ff', speed: 30, react: 60, loudFill: false, cityLine: false, lineH: 70, bright: 100, meter: true,
  ground: TARGET === 'widget' ? 'street' : 'streetWater', traffic: 35, detail: true, back: true, captions: true, drift: false,
  weather: 'none', wxAmt: 50,
  roofLights: true, blinkSpeed: 40, blinkSync: false, blinkBeat: false, blinkColor: '#ff3030', flicker: true, flickAmt: 20,
  search: false, flyers: true, stars: true, shooting: true, skyBody: true, clouds: true, planes: true };
let S;
// Widget, full screen and wallpaper each keep their own settings; presets are shared by all.
const SHARED_KEY = { widget: 'cityPulse', full: 'cityPulse:full', wall: 'cityPulse:wall' }[TARGET];
const KEY = perScreen ? `${SHARED_KEY}:${screenI}` : SHARED_KEY;
// A screen's own settings start as a copy of the shared ones; the wallpaper starts as a copy of the full-screen look.
const stored = localStorage.getItem(KEY) || localStorage.getItem(SHARED_KEY) || (TARGET === 'wall' && localStorage.getItem('cityPulse:full')) || '{}';
let savedView;                                           // span mode forces the tour without overwriting the saved view
function loadSettings(json) {
  S = { ...DEF, ...JSON.parse(json) };
  if (!$('ground').querySelector(`[value="${S.ground}"]`)) S.ground = DEF.ground;   // settings saved by older versions
  if (S.preset === 'Background') S.preset = 'Lounge';
  savedView = S.view; if (spanMode) S.view = 'tour';
}
try { loadSettings(stored); } catch { loadSettings('{}'); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(spanMode ? { ...S, view: savedView } : S)); } catch {} };

// ---------- buildings ----------
// Window styles, in units: cw = column pitch, ch = floor pitch, ww/wh = window size as a share of the cell.
// One style per building, so every building keeps the same kind of window top to bottom.
const STY = {
  grid:   { cw: 2,   ch: 2,   ww: .5,  wh: .55 },          // square windows
  tall:   { cw: 1.6, ch: 2.6, ww: .4,  wh: .7 },
  wide:   { cw: 3,   ch: 1.8, ww: .8,  wh: .45 },
  ribbon: { cw: 0,   ch: 1.6, ww: 1,   wh: .4 },           // one glass strip per floor
  pairs:  { cw: 1.5, ch: 2.2, ww: .6,  wh: .6, skip: 3 },
  slim:   { cw: 1.2, ch: 1.5, ww: .45, wh: .5 },           // dense, small (tall towers)
  cols:   { cw: 1.4, ch: 3.5, ww: .35, wh: .85 },          // vertical slits
};
const taper = (w0, w1, h, n) => Array.from({ length: n }, (_, i) => [w0 + (w1 - w0) * i / (n - 1), h / n]);

// Landmarks with hand-drawn silhouettes. Drawn in units, origin at ground centre, y up = negative.
// L.lit(y) = how lit the lights at height y are (0..1), L.win(a) = light colour, L.body / L.edge = structure colours.
function latticeTower({ hw, top, decks, arches, ant }) {
  const inArch = (x, y) => arches.some(([aw, ah, ay]) => Math.abs(x) < aw && y > ay && y < ay + ah * (1 - (x / aw) ** 2));
  return (g, L) => {
    g.fillStyle = L.body; g.beginPath();
    g.moveTo(hw(0), 0);
    for (let y = 0; y <= top; y += .5) g.lineTo(hw(y), -y);
    for (let y = top; y >= 0; y -= .5) g.lineTo(-hw(y), -y);
    g.closePath();
    for (const [aw, ah, ay] of arches) {
      g.moveTo(aw, -ay); g.quadraticCurveTo(aw, -ay - ah * 1.3, 0, -ay - ah); g.quadraticCurveTo(-aw, -ay - ah * 1.3, -aw, -ay); g.closePath();
    }
    g.fill('evenodd');
    for (const [y, w, th] of decks) g.fillRect(-w, -y - th, 2 * w, th);
    g.fillRect(-ant[2], -ant[1], ant[2] * 2, ant[1] - ant[0]);
    if (L.edge) {
      g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath();
      for (let y = 0; y < top - 2; y += 2.5) {
        const a = hw(y), b = hw(y + 2.5);
        for (const s of [-1, 1]) { g.moveTo(s * a, -y); g.lineTo(s * b * .72, -y - 2.5); g.moveTo(s * a * .72, -y); g.lineTo(s * b, -y - 2.5); }
      }
      g.stroke();
    }
    for (let y = 1; y < top; y += 1.6) {
      g.fillStyle = L.win(L.lit(y)); const w = hw(y);
      for (const k of [.9, .62, .35]) for (const s of [-1, 1]) {
        const x = s * w * k; if (!inArch(x, y)) g.fillRect(x - .22, -y - .22, .44, .44);
      }
    }
    for (const [y, w, th] of decks) { g.fillStyle = L.win(L.lit(y)); for (let x = -w + .5; x < w; x += 1) g.fillRect(x - .2, -y - th / 2 - .2, .4, .4); }
  };
}
const LM = {
  eiffel: { w: 26, h: 80, draw: latticeTower({
    hw: y => y <= 18 ? 5.5 + 7.5 * (1 - y / 18) ** 2 : y <= 37.5 ? 5.5 - 2.5 * (y - 18) / 19.5 : y <= 67 ? 3 - 2.1 * Math.sqrt((y - 37.5) / 29.5) : .9,
    top: 67, decks: [[18, 7.5, 1.8], [37.5, 4.2, 1.4], [65.5, 1.5, 2]], arches: [[8.5, 11.5, 0], [3.6, 7, 19.8]], ant: [67, 80, .25] }) },
  tokyotower: { w: 22, h: 76, draw: latticeTower({
    hw: y => y <= 34 ? 2.6 + 8.4 * (1 - y / 34) ** 1.6 : y <= 58 ? 2.6 - 1.6 * (y - 34) / 24 : .9,
    top: 58, decks: [[30, 5.5, 4], [56, 2.2, 2]], arches: [[7, 9, 0]], ant: [58, 76, .3] }) },
  needle: { w: 15, h: 72, draw(g, L) {
    const hw = y => y < 30 ? .9 + 4.6 * (1 - y / 30) ** 2 : .9 + 1.6 * ((y - 30) / 16) ** 2;
    g.strokeStyle = g.fillStyle = L.body; g.lineWidth = .7; g.beginPath();
    for (const s of [-1, 1]) { g.moveTo(s * hw(0), 0); for (let y = 1; y <= 46; y++) g.lineTo(s * hw(y), -y); }
    g.stroke();
    g.fillRect(-.6, -46, 1.2, 46);
    g.fillRect(-2.4, -14.6, 4.8, .8);
    g.beginPath();
    [[-2.5, -46], [-7.2, -49.6], [-6.4, -50.8], [-5, -51.2], [-1.4, -54], [1.4, -54], [5, -51.2], [6.4, -50.8], [7.2, -49.6], [2.5, -46]]
      .forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
    g.fill();
    g.beginPath(); g.moveTo(-.6, -54); g.lineTo(0, -72); g.lineTo(.6, -54); g.fill();
    if (L.edge) { g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath(); g.moveTo(-7.2, -49.6); g.lineTo(7.2, -49.6); g.moveTo(-5, -51.2); g.lineTo(5, -51.2); g.stroke(); }
    for (let y = 1; y < 45; y += 2) { g.fillStyle = L.win(L.lit(y)); g.fillRect(-.3, -y - .6, .6, .6); }
    g.fillStyle = L.win(L.lit(47.5));
    for (let i = 0; i <= 6; i++) { const f = i / 6; for (const s of [-1, 1]) g.fillRect(s * (2.5 + 4.5 * f) - .2, -46 - 3.5 * f - .2, .4, .4); }
    g.fillStyle = L.win(L.lit(50));
    for (let x = -6.5; x < 6.4; x += .9) g.fillRect(x, -50.6, .55, .7);
  } },
  bigben: { w: 9, h: 63, draw(g, L) {
    g.fillStyle = L.body;
    g.fillRect(-3, -36, 6, 36);
    g.fillRect(-3.7, -44.5, 7.4, 8.5);
    g.fillRect(-3.9, -45.3, 7.8, .8);
    g.fillRect(-3.2, -50, 6.4, 4.7);
    g.beginPath(); g.moveTo(-3.6, -50); g.lineTo(0, -60.5); g.lineTo(3.6, -50); g.fill();
    for (const x of [-3.6, -1.6, 1.6, 3.6]) { g.beginPath(); g.moveTo(x - .45, -50); g.lineTo(x, -53.5); g.lineTo(x + .45, -50); g.fill(); }
    g.fillRect(-.12, -63, .24, 2.6);
    if (L.edge) {
      g.strokeStyle = L.edge; g.lineWidth = .15; g.beginPath();
      for (const x of [-3, -1.5, 1.5, 3]) { g.moveTo(x, 0); g.lineTo(x, -36); }
      for (let y = 6; y < 36; y += 6) { g.moveTo(-3, -y); g.lineTo(3, -y); }
      g.rect(-3.7, -44.5, 7.4, 8.5); g.stroke();
    }
    for (let y = 3; y < 34; y += 3.4) { g.fillStyle = L.win(L.lit(y)); for (const x of [-2.25, -.25, 1.75]) g.fillRect(x, -y - 2, .5, 2); }
    g.fillStyle = L.win(Math.max(L.lit(40), .2));
    g.beginPath(); g.arc(0, -40.2, 2.6, 0, 7); g.fill();
    g.strokeStyle = L.body; g.lineWidth = .25; g.beginPath();
    g.moveTo(0, -40.2); g.lineTo(0, -42.2); g.moveTo(0, -40.2); g.lineTo(1.3, -40.2); g.stroke();
    g.fillStyle = L.win(L.lit(47.5));
    for (const x of [-2.1, -.7, .7, 2.1]) { g.fillRect(x - .35, -48.6, .7, 2.4); g.beginPath(); g.arc(x, -48.6, .35, Math.PI, 0); g.fill(); }
  } },
  chrysler: { w: 13, h: 100, draw(g, L) {
    g.fillStyle = L.body;
    g.fillRect(-6.5, -24, 13, 24);
    g.fillRect(-5, -58, 10, 34);
    g.fillRect(-4, -64, 8, 6);

  const drawSign = (g, b, s, cx, E) => {
    const { unit, GY } = E, u = unit * (E.widget ? 2 : 1), glow = .45 + .55 * Math.max(b.level, b.flash);   // signs are drawn twice as big in the small widget
    const bx = cx - b.wpx / 2, top = GY - b.hU * unit;
    const sw = s.vert ? 1.6 * u : s.len * u, sh = s.vert ? s.len * u : 1.6 * u;
    const x = Math.min(bx + s.fx * Math.max(0, b.wpx - sw), bx + b.wpx - sw * .6), y = Math.max(top + unit, GY - b.hU * unit * s.fy - sh);
    const col = `hsl(${s.hue},100%,${45 + 25 * glow}%)`;
    g.fillStyle = `hsla(${s.hue},100%,60%,${.16 * glow})`; g.fillRect(x - u * .6, y - u * .6, sw + u * 1.2, sh + u * 1.2);
    g.fillStyle = '#07020b'; g.fillRect(x, y, sw, sh);
    g.strokeStyle = col; g.lineWidth = Math.max(1, u * .15); g.strokeRect(x + .5, y + .5, sw - 1, sh - 1);
    g.fillStyle = col;
    const n = Math.floor((s.vert ? sh : sw) / (u * 1.2));
    for (let i = 0; i < n; i++) {                        // each glyph = a few strokes picked from a 2x3 grid
      const gx = s.vert ? x + u * .35 : x + u * .4 + i * u * 1.2, gy = s.vert ? y + u * .4 + i * u * 1.2 : y + u * .35;
      for (let k = 0; k < 6; k++) if (E.hash(s.seed, i, k) < .45) g.fillRect(gx + (k % 2) * u * .45, gy + Math.floor(k / 2) * u * .3, u * .45, u * .18);
    }
  };
  // A big hologram billboard that shows a live equalizer.
  const drawHolo = (g, b, cx, E) => {
    const u = E.unit, w = b.wpx * .8, h = b.holo.h * u, x = cx - w / 2, y = E.GY - b.hU * u * b.holo.fy;
    if (Math.random() < .02) return;                     // the occasional dropout flicker
    const gr = g.createLinearGradient(x, y, x + w, y + h);
    gr.addColorStop(0, 'rgba(60,230,255,.22)'); gr.addColorStop(1, 'rgba(255,60,200,.22)');
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    const sp = E.spectrum, n = sp.length, bw = w / n;
    for (let i = 0; i < n; i++) {
      const bh = h * .85 * Math.min(1, sp[i] * 1.1);
      g.fillStyle = `hsla(${190 + i * 11},100%,65%,.75)`; g.fillRect(x + i * bw + bw * .15, y + h - bh, bw * .7, bh);
    }
    g.fillStyle = 'rgba(255,255,255,.06)'; for (let sy = y; sy < y + h; sy += 3) g.fillRect(x, sy, w, 1);
    g.strokeStyle = 'rgba(120,240,255,.6)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  };
  // Flying cars: little light pairs gliding between the towers, some behind (layer 0), some in front (layer 1).
  let flyers = [];
  const drawFlyers = (g, E, layer) => {
    if (!E.S.flyers) return;
    const { W, GY, unit: u, dt, scrollV } = E;
    if (!flyers.length) flyers = Array.from({ length: 10 }, (_, i) => ({ layer: i % 2, dir: Math.random() < .5 ? 1 : -1, x: Math.random() * W,
      y: GY * (.18 + .55 * Math.random()), v: u * (8 + Math.random() * 10), hue: NEON[i % 3] }));
    for (const f of flyers) {
      if (f.layer !== layer) continue;
      f.x += (f.dir * f.v - scrollV * (layer ? 1 : .5)) * dt;
      if (f.x > W + 60) f.x = -60; else if (f.x < -60) f.x = W + 60;
      const front = f.x + f.dir * u * 1.1, back = f.x - f.dir * u * 1.1;
      const tr = g.createLinearGradient(back, 0, back - f.dir * u * 8, 0);
      tr.addColorStop(0, `hsla(${f.hue},100%,60%,.35)`); tr.addColorStop(1, `hsla(${f.hue},100%,60%,0)`);
      g.fillStyle = tr; g.fillRect(Math.min(back, back - f.dir * u * 8), f.y - u * .12, u * 8, u * .24);
      g.fillStyle = '#0a0a12'; g.fillRect(f.x - u * 1.1, f.y - u * .3, u * 2.2, u * .6);
      g.fillStyle = `hsl(${f.hue},100%,75%)`; g.fillRect(front - u * .2, f.y - u * .15, u * .4, u * .3);
      g.fillStyle = '#ff3355'; g.fillRect(back - u * .15, f.y - u * .12, u * .3, u * .24);
    }
  };
  registerTheme('cyber', { name: 'Cyberpunk', kit: KITS.cyber, minF: .4, maxF: .9, weather: 'rain',
    sky: [[0, '#05010d'], [.7, '#1d0630'], [1, '#3a0a48']],
    drawSky(g, { W, GY }) {
      const hz = g.createLinearGradient(0, GY * .55, 0, GY);
      hz.addColorStop(0, 'rgba(255,40,170,0)'); hz.addColorStop(1, 'rgba(255,40,170,.16)');
      g.fillStyle = hz; g.fillRect(0, GY * .55, W, GY * .45);
    },
    stars: false, moon: false, cloud: 'rgba(120,40,140,.25)', rain: 'rgba(200,170,255,.3)', fogRGB: '200,90,210',
    side: '#100a18', top: '#1c1228',
    back: { h: 1.1, density: 1, body: '#120a20', win: c => c < .5 ? 'rgba(255,90,210,.25)' : 'rgba(80,220,255,.25)' },
    decorate(b, r) {
      b.signs = [];
      const n = r() < .65 ? 1 + (r() < .4 ? 1 : 0) : 0;
      for (let i = 0; i < n; i++) b.signs.push({ vert: r() < .65, fy: .2 + .6 * r(), fx: r(), len: 5 + 7 * r(), hue: NEON[Math.floor(r() * NEON.length)], seed: Math.floor(r() * 1e6) });
      if (b.tiers[0].w >= 9 && b.hU > 40 && r() < .3) b.holo = { fy: .45 + .3 * r(), h: 7 + 5 * r() };
    },
    afterLayout(list, r) {                               // skybridges between neighbouring towers
      flyers = [];
      for (let i = 0; i + 1 < list.length; i++) {
        const a = list[i], c = list[i + 1];
        if (!a.lm && !c.lm && r() < .35) a.bridge = { c, y: Math.min(a.hU, c.hU) * (.35 + .4 * r()) };
      }
    },
    drawBehind: (g, E) => drawFlyers(g, E, 0),
    drawExtras(g, b, cx, tip, E) {
      if (b.holo) drawHolo(g, b, cx, E);
      if (b.signs) for (const s of b.signs) drawSign(g, b, s, cx, E);
      if (b.bridge) {                                    // drawn with the left tower; nothing of the right one covers the gap
        const { c, y } = b.bridge, u = E.unit, x0 = cx + b.wpx / 2, x1 = cx + c.cx - b.cx - c.wpx / 2;
        if (x1 < 0 || x0 > E.W || x1 - x0 < u) return;
        const by = E.GY - y * u;
        g.fillStyle = '#050309'; g.fillRect(x0, by - u, x1 - x0, u * 1.2);
        g.fillStyle = 'rgba(80,220,255,.55)';
        for (let x = x0 + u * .6; x < x1 - u * .6; x += u * 1.4) g.fillRect(x, by - u * .55, u * .7, u * .3);
      }
    },
    drawFront: (g, E) => drawFlyers(g, E, 1),
  });
}

// Noir City: Art Deco towers under a low overcast, washed-out windows, and one rooftop spotlight with the shadow
// of a real-looking bat caught in its soft, round pool of light. An original, naturalistic silhouette (raised wings,
// finger-tip points along the membrane), not any brand's emblem.
{
  // Right half (x 0..1 = body to wingtip, y down), mirrored for the left. Starts at the top of the head.
  const BAT = [
    ['L', .04, -.33], ['L', .07, -.44], ['L', .1, -.3], ['L', .12, -.18],   // ear and head
    ['L', .16, -.1],                                                          // shoulder
    ['Q', .3, -.25, .48, -.5], ['L', .52, -.52],                              // leading edge up to the raised wrist
    ['Q', .75, -.4, .98, -.28],                                               // long outer finger to the wingtip
    ['Q', .84, -.18, .86, .02],                                               // membrane sagging between finger tips
    ['Q', .7, -.06, .62, .16],
    ['Q', .42, -.02, .2, .2],
    ['L', .14, .32], ['L', .05, .3], ['L', -.03, .34],                        // foot and tail membrane
  ];
  let batSprite;
  const getBatSprite = () => {                           // drawn once, opaque, so the two halves never show a seam
    if (batSprite) return batSprite;
    const c = document.createElement('canvas'); c.width = 400; c.height = 220;
    const x = c.getContext('2d'); x.fillStyle = '#0a0a0c';
    for (const sx of [1, -1]) {
      x.save(); x.translate(200, 110); x.scale(sx * 190, 190);
      x.beginPath(); x.moveTo(-.03, -.3);
      for (const [k, ...p] of BAT) k === 'L' ? x.lineTo(...p) : x.quadraticCurveTo(...p);
      x.closePath(); x.fill(); x.restore();
    }
    return batSprite = c;
  };
  const drawBatSignal = (g, tip, { W, H, unit, t }) => {
    const r = Math.min(W, H) * .09;
    const tx = Math.min(W * .85, Math.max(W * .2, tip[0] + W * .18)) + Math.sin(t / 5200) * W * .015, ty = H * .17 + Math.sin(t / 4100) * H * .008;
    const beam = g.createLinearGradient(tip[0], tip[1], tx, ty);
    beam.addColorStop(0, 'rgba(255,245,215,.26)'); beam.addColorStop(1, 'rgba(255,245,215,.06)');
    g.fillStyle = beam; g.beginPath();
    g.moveTo(tip[0] - unit * .4, tip[1]); g.lineTo(tx - r * .8, ty + r * .5); g.lineTo(tx + r * .8, ty - r * .5); g.lineTo(tip[0] + unit * .4, tip[1]); g.fill();
    const pool = g.createRadialGradient(tx, ty, 0, tx, ty, r * 1.15);   // soft round pool of light on the clouds, no hard rim
    pool.addColorStop(0, 'rgba(255,244,210,.55)'); pool.addColorStop(.6, 'rgba(255,244,210,.3)'); pool.addColorStop(1, 'rgba(255,244,210,0)');
    g.fillStyle = pool; g.fillRect(tx - r * 1.15, ty - r * 1.15, r * 2.3, r * 2.3);
    const bw = r * 1.35, bh = bw * 220 / 400;
    g.save(); g.translate(tx, ty); g.rotate(-.12 + Math.sin(t / 3700) * .04);   // tilted and drifting, like a real bat crossing the beam
    g.globalAlpha *= .8; g.drawImage(getBatSprite(), -bw / 2, -bh / 2, bw, bh); g.restore();
  };
  registerTheme('noir', { name: 'Noir City', kit: KITS.noir, minF: .4, maxF: .9, weather: 'rain',
    sky: [[0, '#040405'], [1, '#1c1a16']], stars: false, moon: false, overcast: true, cloud: 'rgba(30,30,33,.72)',
    side: '#0b0b0c', top: '#151515', win: c => ({ h: c.h, s: c.s * .3, m: c.m * .7 }),
    back: { h: 1.1, density: 1, body: '#0d0d0f', win: () => 'rgba(210,170,100,.16)' },
    searchlights: false,                                 // just the one light
    afterLayout(list, r, E) {                            // one rooftop near the left third carries the bat spotlight
      const at = (E.S.view === 'tour' ? list[0].cx : 0) + E.W * .3;
      const cands = list.filter(b => !b.lm && b.floors > 12 && b.floors < 40);
      (cands.length ? cands : list).reduce((a, b) => Math.abs(b.cx - at) < Math.abs(a.cx - at) ? b : a).bat = true;
    },
    drawExtras(g, b, cx, tip, E) { if (b.bat) drawBatSignal(g, tip, E); },
  });
}

// Synthwave: neon-edged blocks, a big striped sun sinking behind neon mountains, and a glowing grid for a floor.
{
  let gridT = 0;
  registerTheme('synth', { name: 'Synthwave', kit: KITS.synth, minF: .25, maxF: .55,
    sky: [[0, '#0b0020'], [.45, '#2b0a4a'], [.8, '#7a1a6a'], [1, '#ff5f7e']], skyToGround: true,
    drawSky(g, { W, H, GY, sky, hash }) {
      const r = Math.min(W, H) * .19, cx = W / 2, cy = GY * .42;   // high enough to clear the towers
      const sun = g.createLinearGradient(0, cy - r, 0, cy + r);
      sun.addColorStop(0, '#ffe66d'); sun.addColorStop(.55, '#ff8a5c'); sun.addColorStop(1, '#ff3d8b');
      g.fillStyle = 'rgba(255,90,150,.18)'; g.beginPath(); g.arc(cx, cy, r * 1.25, 0, 7); g.fill();
      g.fillStyle = sun; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
      g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
      g.fillStyle = sky;
      for (let i = 0; i < 8; i++) g.fillRect(cx - r, cy - r * .05 + i * r * .15, r * 2, 1 + i * r * .02);
      g.restore();
      g.fillStyle = '#1a0634'; g.beginPath(); g.moveTo(0, GY);
      const pts = [];
      for (let x = 0; x <= W + 40; x += 40) pts.push([x, GY - (hash(x, 9, 9) * .5 + .2 * Math.abs(Math.sin(x / 210))) * GY * .2]);
      pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W, GY); g.fill();
      g.strokeStyle = 'rgba(255,61,240,.6)'; g.lineWidth = 1.5; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    },
    moon: false, cloud: 'rgba(255,90,170,.16)', fogRGB: '255,110,200',
    side: '#12062a', top: '#1e0a3c', outline: b => b.id % 2 ? 'rgba(255,79,216,.8)' : 'rgba(62,240,255,.8)',
    back: { h: .6, density: .6, body: '#170a2c', win: c => c < .5 ? 'rgba(255,80,200,.28)' : 'rgba(80,230,255,.28)' },
    ground: { h: .14, draw(g, { W, H, GY, dt, travel }) {
      const gh = H - GY, vx = W / 2, step = W * .08;
      gridT = (gridT + dt * .35) % 1;
      const fl = g.createLinearGradient(0, GY, 0, H);
      fl.addColorStop(0, '#1a0033'); fl.addColorStop(1, '#05000c');
      g.fillStyle = fl; g.fillRect(0, GY, W, gh);
      g.strokeStyle = 'rgba(255,60,220,.65)'; g.lineWidth = 1; g.beginPath();
      for (let i = 0; i < 12; i++) { const y = GY + gh * ((i + gridT) / 12) ** 2; g.moveTo(0, y); g.lineTo(W, y); }
      for (let k = -24; k <= 24; k++) { const xb = vx + k * step - (travel % step); g.moveTo(vx + (xb - vx) * .08, GY); g.lineTo(xb, H); }
      g.stroke();
      g.fillStyle = 'rgba(255,79,216,.9)'; g.fillRect(0, GY, W, 1.5);
    } },
  });
}

// ---------- control center (?control=1) ----------
// The app's own window: what to listen to, where the city shows, which city each screen gets, and the widget. The app
// (cityPulse.control) owns the windows and pushes its state; each screen's city goes straight into that screen's settings.
let ccState = null, ccScreensKey = '';
function screenSettings(target, i) {                     // a screen's own settings, or the shared ones it starts from, like its window does
  const shared = `cityPulse:${target}`;
  try { return JSON.parse(localStorage.getItem(`${shared}:${i}`) || localStorage.getItem(shared) || (target === 'wall' && localStorage.getItem('cityPulse:full')) || '{}'); }
  catch { return {}; }
}
function ccCities() { for (const el of document.querySelectorAll('#ccScreens select')) el.value = screenSettings(el.dataset.t, +el.dataset.i).city || DEF.city; }
function ccSeg(el, items) {                              // a row of buttons: [label, current?, action]
  el.innerHTML = items.map(([label, on], i) => `<button data-i="${i}"${on ? ' class="on"' : ''}>${esc(label)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) items[+b.dataset.i][2](); };
}
function ccRender(st) {
  const C = cityPulse.control, name = x => x.label || `Screen ${x.index + 1}`;
  ccState = st;
  ccSeg($('ccFull'), [['Off', st.fullMode === 'off', () => C.setFull('off')], ['On the widget’s screen', st.fullMode === 'one', () => C.setFull('one')],
    ['All screens: own city each', st.fullMode === 'per', () => C.setFull('per')], ['All screens: one tour across', st.fullMode === 'span', () => C.setFull('span')]]);
  ccSeg($('ccWall'), [['Off', st.wallMode === 'off', () => C.setWall('off')],
    ...st.screens.map(x => [`${name(x)} only`, st.wallMode === 'one' && st.wallScreen === x.index, () => C.setWall('one', x.index)]),
    ['All screens: own city each', st.wallMode === 'per', () => C.setWall('per')], ['All screens: one tour across', st.wallMode === 'span', () => C.setWall('span')]]);
  $('ccWidget').textContent = st.widgetShown ? 'Hide widget' : 'Show widget';
  $('ccWidget').classList.toggle('on', !!st.widgetShown);
  const key = JSON.stringify(st.screens);
  if (key === ccScreensKey) return;                      // rebuild the screen rows only when the screens change
  ccScreensKey = key;
  const pickCity = (t, i) => `<select data-t="${t}" data-i="${i}" aria-label="${t === 'full' ? 'Full-screen' : 'Wallpaper'} city">${$('city').innerHTML}</select>`;
  const more = (t, i) => `<button data-t="${t}" data-i="${i}">More settings…</button>`;
  $('ccScreens').innerHTML = '<span></span><b>Full screen</b><b>Wallpaper</b>' + st.screens.map(x =>
    `<span>${esc(name(x))}<small>${x.w}×${x.h}</small></span>${pickCity('full', x.index)}${pickCity('wall', x.index)}<span></span>${more('full', x.index)}${more('wall', x.index)}`).join('');
  for (const el of document.querySelectorAll('#ccScreens select')) el.onchange = () => {
    const t = el.dataset.t, i = +el.dataset.i, s = screenSettings(t, i), T = THEMES[themeKey(el.value)];
    s.city = el.value;
    if (T.weather && (s.weather || 'none') === 'none') s.weather = T.weather;   // as picking it in Settings does
    try { localStorage.setItem(`cityPulse:${t}:${i}`, JSON.stringify(s)); } catch {}
  };
  for (const b of document.querySelectorAll('#ccScreens button')) b.onclick = () => C.openSettings(b.dataset.t, +b.dataset.i);
  ccCities();
}
function startControl() {
  document.title = 'City Pulse';
  if (!inApp || !cityPulse.control) return;
  const C = cityPulse.control;
  $('ccTour').onclick = () => {                          // one tour across every screen: wherever the city is showing, else full screen
    const f = ccState && ccState.fullMode !== 'off', w = ccState && ccState.wallMode !== 'off';
    if (f || !w) C.setFull('span');
    if (w) C.setWall('span');
  };
  $('ccWidget').onclick = () => C.setWidget(!(ccState && ccState.widgetShown));
  $('ccWidgetSet').onclick = () => C.openSettings('widget', null);
  C.state().then(ccRender);
  C.onState(ccRender);
}

// Start-up that needs every plugin's themes, cities and landmarks: run by the last script on the page, after the plugins.
function start() {
  for (const [k, c] of Object.entries(CITIES)) if (!c.b.every(okSpec)) { console.error(`City Pulse: city "${k}" ignored: it uses an unknown window style or landmark.`); delete CITIES[k]; }
  const opt = (k, name) => `<option value="${esc(k)}">${esc(name)}</option>`;
  $('city').innerHTML = `<optgroup label="Themed">${opt('generic', 'Neon City')}${Object.keys(THEMES).filter(k => k !== 'none').map(k => opt(k, THEMES[k].name)).join('')}</optgroup>` +
    `<optgroup label="Real cities">${Object.entries(CITIES).map(([k, c]) => opt(k, c.name)).join('')}</optgroup>`;
  if (![...$('city').options].some(o => o.value === S.city)) S.city = 'generic';   // its plugin is gone
  showSetting('city'); refreshPanel();
  if (controlMode) return startControl();
  layout();
  addEventListener('resize', layout);
  // The one animation loop. frame() never schedules itself, so an extra call can't start a second loop.
  (function loop(t) { frame(t); requestAnimationFrame(loop); })(performance.now());
}
</script>
<!-- Plugin files: extra themed cities, real cities and landmarks, written against window.CityPulse. A missing file is just skipped. -->
<script src="themes-a.js"></script>
<script src="themes-b.js"></script>
<script src="cities-world.js"></script>
<script>start();</script>
</body>
